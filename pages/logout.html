<!DOCTYPE html>
<html lang="fa" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
        <title>خروج از حساب | صبا حساب</title>

        <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/logout.css">
    </head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">

                <a href="../index.html" class="site-logo">
                    <img src="../assets/images/Site_Logoo.png" alt="">
                </a>


            </div>
        </div>
    </header>


    <!-- Logout -->
    <main class="logout-page">

        <div class="logout-card">

            <div class="logout-icon">
                <span>↪</span>
            </div>

            <h1>با موفقیت خارج شدید</h1>

            <p>
                حساب کاربری شما با موفقیت خارج شد.
                <br>
                برای ورود مجدد می‌توانید دوباره وارد حساب خود شوید.
            </p>

            <a href="../index.html" class="logout-btn">
                بازگشت به صفحه اصلی
            </a>

            <div class="logout-countdown">
                انتقال خودکار تا
                <span id="countdown">5</span>
                ثانیه دیگر
            </div>

        </div>

    </main>




    <!-- JS صفحه Logout -->
    <script src="../js/logout.js"></script>

</body>

</html>
